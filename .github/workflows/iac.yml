name: iac-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secrets in full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt and validate
        run: |
          terraform fmt -check -recursive
          terraform -chdir=envs/free init -backend=false -input=false
          terraform -chdir=envs/free validate

      - name: Checkov (built-in and custom policies)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: envs/free
          framework: terraform
          external_checks_dirs: policies
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Trivy (IaC misconfigurations)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1 envs/free

      - name: Upload Checkov results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
