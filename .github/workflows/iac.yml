name: iac-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks (secrets in full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Terraform fmt and validate
        run: |
          terraform fmt -check -recursive
          terraform -chdir=envs/free init -backend=false -input=false
          terraform -chdir=envs/free validate

      - name: Checkov (built-in and custom policies)
        uses: bridgecrewio/checkov-action@a76233b2c1d4a820a9dc68be350c473a4a9dceec # v12
        with:
          directory: envs/free
          framework: terraform
          external_checks_dirs: policies
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Trivy (IaC misconfigurations)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            config --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1 envs/free

      - name: Upload Checkov results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          sarif_file: checkov.sarif
